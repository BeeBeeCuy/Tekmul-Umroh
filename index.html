<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Belajar Ihram & Umroh — Media Interaktif</title>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Stylesheet dipecah per bagian (lihat folder css/). Urutan pemuatan
       menentukan cascade, jadi jangan diubah tanpa alasan. -->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/splash.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/home.css">
  <link rel="stylesheet" href="css/lesson.css">
  <link rel="stylesheet" href="css/quiz.css">
  <link rel="stylesheet" href="css/certificate.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>

  <div id="splash">
    <div class="splash-geo"></div>
    <div class="splash-logo">
      <svg viewBox="0 0 46 46" fill="none">
        <rect x="8" y="18" width="30" height="22" rx="3" stroke="#f0c96e" stroke-width="1.5" />
        <path d="M15 18V13a8 8 0 0116 0v5" stroke="#f0c96e" stroke-width="1.5" stroke-linecap="round" />
        <circle cx="23" cy="29" r="3" fill="#f0c96e" />
        <line x1="23" y1="32" x2="23" y2="36" stroke="#f0c96e" stroke-width="1.5" stroke-linecap="round" />
      </svg>
    </div>
    <div>
      <div class="splash-title">بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ</div>
      <div style="font-family:'Plus Jakarta Sans',sans-serif; font-size:1.2rem; color:#fff; text-align:center; font-weight:600; margin-top:8px;">
        Belajar Ihram & Umroh
      </div>
      <div class="splash-sub" style="margin-top:4px;">Media Pembelajaran Interaktif</div>
    </div>
    <input id="namaInput" class="splash-input" type="text" placeholder="Masukkan nama Anda" maxlength="40" autocomplete="name" />
    <button class="splash-btn" onclick="startApp()">Mulai Belajar ✦</button>
  </div>

  <div id="app">

    <div class="topbar">
      <div class="topbar-logo">
        <svg viewBox="0 0 18 18" fill="none">
          <rect x="2" y="8" width="14" height="9" rx="1.5" stroke="#fff" stroke-width="1.2" />
          <path d="M5 8V5.5a4 4 0 018 0V8" stroke="#fff" stroke-width="1.2" stroke-linecap="round" />
          <circle cx="9" cy="12" r="1.5" fill="#fff" />
        </svg>
      </div>
      <div class="topbar-title">Ihram & Umroh</div>
      <div class="topbar-progress">
        <span id="xpText">0 XP</span>
        <div class="progress-bar-top">
          <div class="progress-fill" id="topProgress" style="width:0%"></div>
        </div>
      </div>
    </div>

    <!-- Layar (Home, Modul 1–4, Kuis, Sertifikat) disuntikkan ke sini oleh
         js/main.js dari file-file di folder screens/. -->
    <div class="main-content" id="screensContainer"></div>

    <div class="bottom-nav" id="bottomNav">
      <div class="nav-indicator" id="navIndicator" style="width:20%; left:0%"></div>

      <button class="nav-btn active" onclick="navTo(0,'screenHome')" id="navHome">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M3 12L12 4l9 8" />
          <path d="M5 10v9a1 1 0 001 1h4v-5h4v5h4a1 1 0 001-1v-9" />
        </svg>
        Beranda
      </button>

      <button class="nav-btn" onclick="navTo(1,'screenM1')" id="navM1">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <rect x="4" y="4" width="16" height="16" rx="2" />
          <path d="M8 10h8M8 14h5" />
        </svg>
        Materi
      </button>

      <button class="nav-btn" onclick="goQuiz()" id="navQuiz">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <circle cx="12" cy="12" r="9" />
          <path d="M12 8v4l3 3" />
        </svg>
        Kuis
      </button>

      <button class="nav-btn" onclick="openSertifikat()" id="navSert">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M12 2l2 7h7l-5.5 4 2 7L12 16l-5.5 4 2-7L3 9h7z" />
        </svg>
        Sertifikat
      </button>
    </div>
  </div>

  <!-- Data terlebih dahulu, lalu modul logika. main.js dimuat terakhir karena
       ia yang men-fetch partial layar & menjalankan inisialisasi. -->
  <script src="js/data/larangan-data.js"></script>
  <script src="js/data/quiz-data.js"></script>
  <script src="js/state.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/quiz.js"></script>
  <script src="js/interactions.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
